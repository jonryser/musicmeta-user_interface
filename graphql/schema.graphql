type Work {
  guid: ID!
  title: String!
  description: String
  createdAt: String!
  updatedAt: String!
  deletedAt: String
  versions: [WorkVersion!]!
  credits: [Credit!]!
  links: [Link!]!
}

type WorkVersion {
  guid: ID!
  title: String!
  description: String
  work: Work!
  parentVersion: WorkVersion
  createdAt: String!
  updatedAt: String!
  deletedAt: String
}

type Person {
  guid: ID!
  firstName: String!
  lastName: String!
  email: String
  createdAt: String!
  updatedAt: String!
  deletedAt: String
}

type Place {
  guid: ID!
  name: String!
  description: String
  city: String
  state: String
  country: String
  createdAt: String!
  updatedAt: String!
  deletedAt: String
}

type Role {
  guid: ID!
  name: String!
  description: String
}

type Credit {
  guid: ID!
  work: Work!
  person: Person!
  role: Role!
  instrument: String
  notes: String
  createdAt: String!
  updatedAt: String!
  deletedAt: String
}

enum LinkType {
  audio
  image
  document
  video
  streaming
  purchase
  other
}

type Link {
  guid: ID!
  work: Work!
  url: String!
  linkType: LinkType!
  description: String
  createdAt: String!
  updatedAt: String!
  deletedAt: String
}

type Query {
  works: [Work!]!
  work(guid: ID!): Work
  people: [Person!]!
  person(guid: ID!): Person
  places: [Place!]!
  place(guid: ID!): Place
  creditsByWork(workGuid: ID!): [Credit!]!
  linksByWork(workGuid: ID!): [Link!]!
  roles: [Role!]!
}

type Mutation {
  createWork(title: String!, description: String): Work!
  updateWork(guid: ID!, title: String, description: String): Work!
  deleteWork(guid: ID!): Work!
  createCredit(workGuid: ID!, personGuid: ID!, roleGuid: ID!, instrument: String, notes: String): Credit!
  deleteCredit(guid: ID!): Credit!
  createLink(workGuid: ID!, url: String!, linkType: LinkType!, description: String): Link!
  deleteLink(guid: ID!): Link!
}
